<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350">
  <rect width="100%" height="100%" fill="#f7f9fc"/>
  <text x="110" y="110" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#111827">Week 5 AWS Static Website Architecture</text>
  <text x="112" y="170" font-family="Arial, sans-serif" font-size="34" fill="#4b5563">S3 + CloudFront + Route 53 + ACM HTTPS | portfolio.meepsstore.me</text>
  <rect x="80" y="190" width="2240" height="1075" rx="42" fill="#ffffff" stroke="#e5e7eb" stroke-width="3"/>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#111827"/>
    </marker>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#dc2626"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <rect x="140" y="330" width="410" height="230" rx="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <text x="330" y="400" font-size="32" font-weight="700" fill="#111827">User / Browser</text>
    <text x="330" y="450" font-size="25" fill="#4b5563">Requests:</text>
    <text x="330" y="485" font-size="25" fill="#4b5563">portfolio.meepsstore.me</text>

    <rect x="820" y="260" width="420" height="240" rx="32" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
    <rect x="860" y="300" width="105" height="105" rx="18" fill="#6d28d9"/>
    <text x="888" y="368" font-size="44" font-weight="700" fill="#ffffff">53</text>
    <text x="1000" y="345" font-size="32" font-weight="700" fill="#111827">Route 53</text>
    <text x="1000" y="395" font-size="25" fill="#4b5563">Hosted zone: meepsstore.me</text>
    <text x="1000" y="430" font-size="25" fill="#4b5563">A Alias record</text>

    <rect x="790" y="610" width="480" height="265" rx="32" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
    <circle cx="897" cy="717" r="58" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
    <text x="995" y="685" font-size="32" font-weight="700" fill="#111827">CloudFront CDN</text>
    <text x="995" y="735" font-size="25" fill="#4b5563">Caches content nearby</text>
    <text x="995" y="770" font-size="25" fill="#4b5563">Default root: index.html</text>
    <text x="995" y="805" font-size="25" fill="#4b5563">Redirect HTTP → HTTPS</text>

    <rect x="1670" y="520" width="560" height="240" rx="32" fill="#fef2f2" stroke="#fca5a5" stroke-width="3"/>
    <rect x="1720" y="565" width="105" height="125" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/>
    <text x="1860" y="600" font-size="32" font-weight="700" fill="#111827">ACM Certificate</text>
    <text x="1860" y="650" font-size="25" fill="#4b5563">SSL/TLS for HTTPS</text>
    <text x="1860" y="685" font-size="25" fill="#4b5563">DNS validation | us-east-1</text>

    <rect x="760" y="990" width="540" height="235" rx="32" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
    <rect x="810" y="1060" width="120" height="105" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
    <ellipse cx="870" cy="1060" rx="60" ry="25" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
    <text x="970" y="1065" font-size="32" font-weight="700" fill="#111827">Private S3 Bucket</text>
    <text x="970" y="1115" font-size="25" fill="#4b5563">week5-static-site-meeps</text>
    <text x="970" y="1150" font-size="25" fill="#4b5563">index.html • style.css • assets/</text>
    <text x="970" y="1185" font-size="25" fill="#4b5563">Block Public Access: ON</text>

    <line x1="550" y1="392" x2="820" y2="345" stroke="#111827" stroke-width="6" stroke-dasharray="24 16" marker-end="url(#arrow)"/>
    <line x1="1030" y1="500" x2="1030" y2="610" stroke="#111827" stroke-width="6" stroke-dasharray="24 16" marker-end="url(#arrow)"/>
    <line x1="550" y1="515" x2="790" y2="720" stroke="#2563eb" stroke-width="7" marker-end="url(#arrowBlue)"/>
    <line x1="1015" y1="875" x2="1015" y2="990" stroke="#16a34a" stroke-width="7" marker-end="url(#arrowGreen)"/>
    <line x1="1300" y1="1110" x2="1270" y2="785" stroke="#16a34a" stroke-width="5" stroke-dasharray="24 16" marker-end="url(#arrowGreen)"/>
    <line x1="1670" y1="640" x2="1270" y2="705" stroke="#dc2626" stroke-width="6" stroke-dasharray="24 16" marker-end="url(#arrowRed)"/>

    <text x="610" y="340" font-size="22" fill="#111827">1. DNS lookup</text>
    <text x="1140" y="555" font-size="18" fill="#111827">2. Alias routes to CloudFront</text>
    <text x="595" y="625" font-size="22" fill="#111827">3. HTTPS request</text>
    <text x="1130" y="935" font-size="18" fill="#111827">4. Fetch from S3 if not cached</text>
    <text x="1360" y="960" font-size="18" fill="#111827">OAC + bucket policy allows CloudFront only</text>
    <text x="1360" y="620" font-size="18" fill="#111827">TLS certificate attached to CloudFront</text>

    <rect x="140" y="1235" width="2090" height="60" rx="18" fill="#111827"/>
    <text x="170" y="1274" font-size="25" fill="#ffffff">Security model: users never access S3 directly • CloudFront serves cached static files over HTTPS • Route 53 handles DNS</text>
  </g>
</svg>